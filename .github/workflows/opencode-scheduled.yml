name: Scheduled OpenCode Task

on:
  schedule:
    - cron: "0 9 * * 0" # Every Sunday at 9am UTC
  workflow_dispatch:

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Права по учебной схеме (код + результаты CI — чтение), кроме issues:
    # эта задача сама открывает issue по найденным TODO, поэтому issues
    # остаётся write. id-token не нужен: use_github_token: true, OIDC-обмен
    # не выполняется.
    permissions:
      contents: read
      issues: write
      actions: read
      checks: read
      statuses: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Review the codebase for any TODO comments and create a summary.
            If you find issues worth addressing, open an issue to track them.
