services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MEETINGS_DB_PATH=/app/data/meetings.sqlite
      - AUTH_DISABLED=1
    volumes:
      - meetings-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/me" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  meetings-data:
